url: https://github.com/<owner>/<repo>
name: 项目总控台
category: productivity
description:
  zh: 把同时在跑的项目按模块管起来：状态、进度、待跟进与 DDL 风险一屏看完，内置概览、看板、列表、日历、时间线、待跟进六个维度的看板，并支持用自然语言增删改查项目（增删改先生成变更清单，确认后才写入，可撤销）。
  en: Manage all your parallel projects by module — status, progress, follow-ups and deadline risk in one view, with overview, status board, list, calendar, timeline and follow-up dashboards, plus natural-language create/update/delete/query that always previews a change list for confirmation before writing, with one-step undo.
